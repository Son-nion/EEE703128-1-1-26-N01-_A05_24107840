name: RTL to GDS Flow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-gds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OpenLane via Docker
        run: |
          docker run --rm \
            -v $(pwd):/openlane/designs/my_design \
            -e PDK_ROOT=/openlane/pdks \
            efabless/openlane:v1.0.0 \
            bash -c "./flow.tcl -design my_design -config_file designs/my_design/openlane/config.json"

      - name: Upload GDSII Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gds-output
          path: |
            openlane/runs/*/results/final/gds/*.gds
            openlane/runs/*/reports/
